<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>업무 데이터 관리</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <aside><h1>데이터 관리</h1><nav id="entities" aria-label="엔티티 목록"></nav></aside>
  <main>
    <header><h2 id="title">불러오는 중</h2><button id="new" type="button" disabled>새로 등록</button></header>
    <p id="message" role="status" aria-live="polite"></p>
    <label for="search">검색 · 모든 문자 필드</label>
    <input id="search" type="search" placeholder="검색어 입력" disabled>
    <p id="count"></p>
    <div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
    <section aria-labelledby="form-title">
      <h2 id="form-title">등록</h2>
      <form id="form"><div id="fields"></div><div class="actions"><button id="save" disabled>저장</button><button id="cancel" type="button">취소</button><button id="delete" type="button" hidden>삭제</button></div></form>
    </section>
  </main>
</body>
</html>
